# ============================================================
#  BotHelper — configuración
#  Tras cambiar algo: /bothelper reload (o reinicia el servidor)
# ============================================================

# Quiénes son bots: los nombres de esta lista y los que empiecen por "prefix"
bots:
  - Bot_Lenador
  - Bot_Minero
  - Bot_Granjero
  - Bot_Pescador
  - Bot_Organizador
  - Bot_Artesano
prefix: "Bot_"

# Rendimiento
performance:
  # Los bots no hacen aparecer criaturas a su alrededor (como un espectador): menos entidades y menos lag
  no-mob-spawning: true
  # Los bots no cuentan para dormir: puedes pasar la noche aunque ellos estén despiertos
  ignore-sleep: true

# Protección de los bots (sus herramientas se siguen gastando igual)
protection:
  # Sin daño de monstruos (golpes, flechas, explosiones de creeper, pociones de bruja, veneno…)
  no-monster-damage: true
  # Sin daño por caída
  no-fall-damage: true
  # Los monstruos no los persiguen
  no-monster-target: true
  # Los bots no pueden poner bloques sólidos encima de un cofre (si no, el cofre no se abre)
  no-blocks-on-chests: true

# Chat: sin mensajes de entrada, salida, muerte ni logros de los bots
chat:
  silence-bots: true

# Imán: lo que suelta un bloque que rompe un bot aparece a sus pies
magnet:
  enabled: true

# Pesca
fishing:
  # Lo que pesca un bot aparece directamente a sus pies en vez de volar hacia él (desde algunas orillas
  # el objeto choca con el borde, cae al agua y se pierde)
  deliver-catch: true

# Registro de diagnóstico (lo que el servidor ve que hacen los bots). Se puede activar sin reiniciar:
# /bothelper debug on | off
debug:
  enabled: false

# Conexión con el panel de control (solo desde este mismo PC)
http:
  enabled: true
  port: 8200
  # Clave que debe mandar el panel. Si está vacía se genera una al arrancar
  # (también se escribe en plugins/BotHelper/token.txt, de donde la lee el panel)
  token: ""
