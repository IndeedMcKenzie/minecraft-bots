# ============================================================
#  BotHelper — configuración
#  Tras cambiar algo: /bothelper reload (o reinicia el servidor)
# ============================================================

# Quiénes son bots: los nombres de esta lista y los que empiecen por "prefix"
bots:
  - Bot_Lenador
  - Bot_Minero
  - Bot_Granjero
  - Bot_Pescador
  - Bot_Organizador
  - Bot_Artesano
prefix: "Bot_"
# Bots cazadores: para las criaturas cuentan como jugadores (a su alrededor aparecen monstruos y desaparecen como
# alrededor de un jugador). Sin esto, el Cazador explorando no encontraría ninguno (ver cleanup)
hunters:
  - Bot_Cazador

# Rendimiento
performance:
  # Los bots no cuentan para el límite de criaturas (setAffectsSpawning). OJO: en Paper 26.2 esto NO impide que
  # aparezcan a su alrededor (de eso se encarga cleanup.prevent-spawns) y SÍ impide que desaparezcan solas
  no-mob-spawning: true
  # Los bots no cuentan para dormir: puedes pasar la noche aunque ellos estén despiertos
  ignore-sleep: true
  # El servidor carga alrededor de cada bot solo los chunks que el bot pide (su distancia de visión, que se fija
  # en config.js del panel), no los de view-distance de server.properties: mucha menos memoria y disco
  bot-view-distance: true

# Criaturas alrededor de los bots: en Paper 26.2 aparecen a su alrededor (cientos por minuto) y, como los bots no
# cuentan para que desaparezcan solas, se acumulaban por miles. Cada minuto se quitan los monstruos, murciélagos y
# peces "desechables" (sin nombre, sin correa, no persistentes, no sacados con un cubo) que estén a más de `radius`
# bloques de cualquier jugador real. Nunca toca animales de granja, aldeanos ni jefes, ni nada cerca de un jugador
# (cerca de ti aparecen y desaparecen como siempre).
cleanup:
  enabled: true
  radius: 128
  # Además, no dejar que aparezcan (de forma natural o en patrullas) monstruos, murciélagos ni peces lejos de los
  # jugadores reales: en Paper 26.2 aparecían cientos por minuto alrededor de los bots
  prevent-spawns: true

# Protección de los bots (sus herramientas se siguen gastando igual)
protection:
  # Sin daño de monstruos (golpes, flechas, explosiones de creeper, pociones de bruja, veneno…)
  no-monster-damage: true
  # Sin daño por caída
  no-fall-damage: true
  # Los monstruos no los persiguen
  no-monster-target: true
  # Los bots no pueden poner bloques sólidos encima de un cofre (si no, el cofre no se abre)
  no-blocks-on-chests: true

# Chat: sin mensajes de entrada, salida, muerte ni logros de los bots
chat:
  silence-bots: true

# Imán: lo que suelta un bloque que rompe un bot aparece a sus pies
magnet:
  enabled: true
  # Lo que suelta una criatura que mata un bot (y su experiencia) va directamente a su inventario
  mob-loot: true

# Pesca
fishing:
  # Lo que pesca un bot aparece directamente a sus pies en vez de volar hacia él (desde algunas orillas
  # el objeto choca con el borde, cae al agua y se pierde)
  deliver-catch: true

# Registro de diagnóstico (lo que el servidor ve que hacen los bots). Se puede activar sin reiniciar:
# /bothelper debug on | off
debug:
  enabled: false

# Conexión con el panel de control (solo desde este mismo PC)
http:
  enabled: true
  port: 8200
  # Clave que debe mandar el panel. Si está vacía se genera una al arrancar
  # (también se escribe en plugins/BotHelper/token.txt, de donde la lee el panel)
  token: ""
