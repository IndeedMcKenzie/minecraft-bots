<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bots Minecraft</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #f0f1f4;
    --border: #dde0e6;
    --text: #1d2129;
    --muted: #677085;
    --accent: #2f6fdb;
    --ok: #1f9d55;
    --warn: #c98a00;
    --err: #d33c3c;
    --idle: #9aa2b1;
    --health: #e0464e;
    --log-bg: #ffffff;
    --series-1: #2a78d6;      /* serie única de los gráficos (validada contra el fondo claro) */
    --grid: #e6e8ec;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c;
      --surface: #1e2128;
      --surface-2: #262a33;
      --border: #323743;
      --text: #e6e8ee;
      --muted: #949cad;
      --accent: #5b93f0;
      --ok: #3cc47a;
      --warn: #e7b23a;
      --err: #f06565;
      --idle: #6c7486;
      --health: #f0646b;
      --log-bg: #181a20;
      --series-1: #3987e5;    /* mismo azul, paso para fondo oscuro (validado) */
      --grid: #2c3039;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  /* Sin esto, reglas como .overlay { display: grid } anulan el atributo hidden */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .server { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .meta { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--idle); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
  .dot.warn { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
  .dot.err { background: var(--err); }
  @keyframes pulse { 50% { opacity: .35; } }

  button {
    font: inherit;
    font-size: 13px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.busy { opacity: .6; cursor: progress; pointer-events: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--err); }
  button.danger.confirm { background: var(--err); border-color: var(--err); color: #fff; }

  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 16px 20px 20px;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color .2s;
  }
  .card.problem { border-color: color-mix(in srgb, var(--err) 60%, var(--border)); }
  .card.caution { border-color: color-mix(in srgb, var(--warn) 60%, var(--border)); }

  .alerts { display: flex; flex-direction: column; gap: 4px; }
  .alert {
    display: flex;
    gap: 6px;
    font-size: 12px;
    border-radius: 7px;
    padding: 5px 9px;
    overflow-wrap: anywhere;
  }
  .alert.err { color: var(--err); background: color-mix(in srgb, var(--err) 12%, transparent); font-weight: 600; }
  .alert.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); font-weight: 600; }
  .alert.info { color: var(--muted); background: var(--surface-2); }
  .alert .since { font-weight: 400; opacity: .8; white-space: nowrap; margin-left: auto; }
  .alert-summary { font-size: 12.5px; padding: 4px 10px; }
  .alert-summary.err { color: var(--err); border-color: var(--err); font-weight: 600; }
  .alert-summary.warn { color: var(--warn); border-color: var(--warn); font-weight: 600; }
  .card-head { display: flex; align-items: center; gap: 10px; }
  .card-head .emoji { font-size: 22px; }
  .card-head .name { font-weight: 600; font-size: 15px; }
  .card-head .user { color: var(--muted); font-size: 12px; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }

  .activity {
    font-size: 13px;
    background: var(--surface-2);
    border-radius: 7px;
    padding: 6px 9px;
    min-height: 32px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .activity .ago { color: var(--muted); font-size: 11px; margin-left: 4px; }
  .issue { color: var(--err); font-size: 12px; overflow-wrap: anywhere; }

  .bar-row { display: grid; grid-template-columns: 18px 1fr 42px; align-items: center; gap: 8px; font-size: 12px; }
  .bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; border-radius: 4px; transition: width .4s; }
  .bar.health > span { background: var(--health); }
  .bar-row .num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  .facts { display: grid; grid-template-columns: 18px 1fr; gap: 3px 8px; font-size: 13px; }
  .facts .v { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .facts .v.low { color: var(--warn); font-weight: 600; }
  .deposit { font-size: 12px; color: var(--muted); }
  .deposit b { color: var(--text); font-weight: 600; }
  .items { display: flex; flex-wrap: wrap; gap: 4px; font-size: 11.5px; }
  .chip {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 6px;
  }
  .chip.kept { color: var(--muted); border-style: dashed; }

  .card-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }

  .logs {
    flex: 1;
    min-height: 220px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .logs-head {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .logs-head .title { font-weight: 600; margin-right: 6px; }
  .tab { padding: 4px 10px; border-radius: 6px; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .log-list {
    flex: 1;
    overflow: auto;
    background: var(--log-bg);
    font: 12.5px/1.5 Consolas, "Cascadia Mono", ui-monospace, monospace;
    padding: 6px 0;
  }
  .log { padding: 1px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .log .time { color: var(--muted); margin-right: 8px; }
  .log.warn { color: var(--warn); }
  .log.error { color: var(--err); }
  .empty { color: var(--muted); padding: 12px; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    max-width: calc(100% - 32px);
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
  }
  .toast.error { background: var(--err); color: #fff; }

  .overlay {
    position: fixed;
    inset: 0;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    display: grid;
    place-items: center;
    text-align: center;
    font-size: 15px;
    padding: 20px;
  }
  .overlay strong { display: block; font-size: 18px; margin-bottom: 6px; }

  /* ── Pestañas de vista ── */
  .views { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 8px; }
  .view-tab { border: none; background: transparent; padding: 5px 12px; }
  .view-tab.active { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }

  /* ── Estadísticas ── */
  .stats-view { overflow: auto; }
  .stats-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .seg { display: flex; gap: 2px; background: var(--surface-2); padding: 3px; border-radius: 8px; }
  .seg-btn { border: none; background: transparent; padding: 5px 12px; }
  .seg-btn.active { background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
  .muted { color: var(--muted); font-weight: 400; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .kpi .k-label { color: var(--muted); font-size: 12.5px; }
  .kpi .k-value { font-size: 28px; font-weight: 650; line-height: 1.2; margin-top: 2px; }
  .kpi .k-sub { color: var(--muted); font-size: 12px; margin-top: 2px; min-height: 1.2em; }

  .panel-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px 14px;
    min-width: 0;
  }
  .card-title { font-weight: 600; margin-bottom: 10px; }

  .chart-wrap { position: relative; overflow-x: auto; }
  .chart-wrap svg { display: block; width: 100%; min-width: 520px; height: 200px; }
  .chart-wrap .axis-label { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart-wrap .gridline { stroke: var(--grid); stroke-width: 1; }
  .chart-wrap .baseline { stroke: var(--border); stroke-width: 1; }
  .chart-wrap .bar { fill: var(--series-1); }
  .chart-wrap .hit { fill: transparent; cursor: default; }
  .chart-wrap .bar.hover { opacity: .75; }
  .chart-tip {
    position: absolute;
    pointer-events: none;
    background: var(--text);
    color: var(--bg);
    font-size: 12px;
    padding: 7px 9px;
    border-radius: 7px;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,.25);
    transform: translateX(-50%);
  }
  .chart-tip b { display: block; margin-bottom: 2px; }
  .chart-empty { color: var(--muted); padding: 30px 0; text-align: center; }

  .table-wrap { overflow-x: auto; }
  .stats-table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .stats-table th, .stats-table td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .stats-table th:first-child, .stats-table td:first-child { text-align: left; }
  .stats-table th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .stats-table td { font-variant-numeric: tabular-nums; }
  .stats-table tr:last-child td { border-bottom: none; }

  .breakdowns { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .hbars { display: grid; gap: 6px; }
  .hbar { display: grid; grid-template-columns: minmax(80px, 34%) 1fr auto; align-items: center; gap: 8px; font-size: 12.5px; }
  .hbar .track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
  .hbar .fill { height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; }
  .hbar .val { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 3ch; text-align: right; }

  /* ── Almacén ── */
  .wh-view { overflow: auto; }
  .wh-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .wh-head input[type=search], .wh-head select, .qty {
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 10px;
  }
  .wh-head input[type=search] { flex: 1; min-width: 180px; max-width: 340px; }
  .wh-status { font-size: 13px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); }
  .wh-status.busy { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-weight: 600; }
  .wh-status.warn { background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); font-weight: 600; }
  .cat-chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .wh-table td.item { font-weight: 600; }
  .wh-table td .stacks { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .wh-table td.order { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
  .qty { width: 78px; padding: 4px 8px; text-align: right; }

  /* ── Rendimiento del servidor (plugin) ── */
  .perf { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .perf .bad { color: var(--warn); font-weight: 600; }

  /* ── Consola ── */
  .console-view { gap: 10px; }
  .console-out {
    flex: 1;
    min-height: 260px;
    overflow: auto;
    margin: 0;
    padding: 10px 12px;
    background: var(--log-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    font: 12.5px/1.5 Consolas, "Cascadia Mono", ui-monospace, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .console-out .cmd { color: var(--accent); font-weight: 600; }
  .console-out .err { color: var(--err); }
  .console-out .muted { color: var(--muted); }
  .console-form { display: flex; gap: 8px; }
  .console-form input {
    flex: 1;
    min-width: 0;
    font: 13px Consolas, "Cascadia Mono", ui-monospace, monospace;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 10px;
  }

  /* ── Mapa (BlueMap) ── */
  .map-view { padding-bottom: 16px; }
  .map-frame {
    flex: 1;
    width: 100%;
    min-height: 420px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
  }

  @media (max-width: 600px) {
    header, main { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
  <header>
    <h1>🤖 Bots Minecraft</h1>
    <div class="server"><span class="dot" id="server-dot"></span><span id="server-text">Comprobando servidor…</span></div>
    <span class="perf" id="server-perf" hidden></span>
    <span class="meta" id="meta"></span>
    <button class="alert-summary" id="alert-summary" title="Ir al primer bot con alertas">✅ Sin alertas</button>
    <nav class="views" aria-label="Vistas">
      <button class="view-tab active" data-view="bots">🤖 Bots</button>
      <button class="view-tab" data-view="warehouse">📦 Almacén</button>
      <button class="view-tab" data-view="stats">📊 Estadísticas</button>
      <button class="view-tab" data-view="map" hidden>🗺️ Mapa</button>
      <button class="view-tab" data-view="console">🖥️ Consola</button>
    </nav>
    <div class="spacer"></div>
    <div class="actions">
      <button class="primary" data-all="start">▶ Iniciar todos</button>
      <button data-all="stop">■ Detener todos</button>
      <button class="danger" id="shutdown">⏻ Apagar</button>
    </div>
  </header>

  <main id="view-stats" class="stats-view" hidden>
    <div class="stats-head">
      <div class="seg" role="group" aria-label="Periodo">
        <button class="seg-btn active" data-period="session">Esta sesión</button>
        <button class="seg-btn" data-period="total">Desde siempre</button>
      </div>
      <span class="meta" id="stats-since"></span>
    </div>

    <section class="kpis" id="kpis"></section>

    <section class="panel-card">
      <div class="card-title">Objetos guardados en casa por hora <span class="muted">· últimas 24 h, todos los bots</span></div>
      <div class="chart-wrap" id="hourly-chart"></div>
    </section>

    <section class="panel-card">
      <div class="card-title">Por bot</div>
      <div class="table-wrap"><table class="stats-table" id="bots-table"></table></div>
    </section>

    <section class="breakdowns">
      <div class="panel-card"><div class="card-title">⛏️ Minerales por tipo</div><div class="hbars" id="bd-minerales"></div></div>
      <div class="panel-card"><div class="card-title">🎣 Pesca</div><div class="hbars" id="bd-pesca"></div></div>
      <div class="panel-card"><div class="card-title">🗂️ Almacén por categoría</div><div class="hbars" id="bd-almacen"></div></div>    </section>
  </main>

  <main id="view-warehouse" class="wh-view" hidden>
    <div class="wh-head">
      <input type="search" id="wh-search" placeholder="Buscar objeto… (p. ej. diamante, iron, log)" aria-label="Buscar objeto">
      <label class="meta">Entregar a <select id="wh-player"></select></label>
      <button id="wh-scan" title="El Organizador abre todos los cofres del almacén y apunta lo que hay">🔄 Revisar almacén</button>
      <span class="meta" id="wh-meta"></span>
    </div>
    <div class="wh-status" id="wh-status"></div>
    <div class="cat-chips" id="wh-cats"></div>
    <section class="panel-card">
      <div class="table-wrap"><table class="stats-table wh-table" id="wh-table"></table></div>
    </section>
  </main>

  <main id="view-console" class="console-view" hidden>
    <div class="wh-status" id="console-status"></div>
    <pre class="console-out" id="console-out"><span class="muted">Escribe un comando del servidor (sin / o con /), por ejemplo: time set day · weather clear · list</span>
</pre>
    <form class="console-form" id="console-form" autocomplete="off">
      <input id="console-input" placeholder="Comando…  (↑ / ↓ para repetir los anteriores)" aria-label="Comando del servidor" maxlength="500">
      <button class="primary" type="submit">Ejecutar</button>
    </form>
  </main>

  <main id="view-map" class="map-view" hidden>
    <iframe class="map-frame" id="map-frame" title="Mapa del mundo (BlueMap)"></iframe>
  </main>

  <main id="view-bots">
    <section class="cards" id="cards"></section>

    <section class="logs">
      <div class="logs-head">
        <span class="title">Registro</span>
        <button class="tab active" data-filter="all">Todos</button>
        <button class="tab" data-filter="woodcutter">🪓 Leñador</button>
        <button class="tab" data-filter="miner">⛏️ Minero</button>
        <button class="tab" data-filter="farmer">🌾 Granjero</button>
        <button class="tab" data-filter="fisher">🎣 Pescador</button>
        <button class="tab" data-filter="organizer">🗂️ Organizador</button>
        <button class="tab" data-filter="rancher">🐄 Ganadero</button>
        <button class="tab" data-filter="artisan">🛠️ Artesano</button>
        <button class="tab" data-filter="panel">Panel</button>
      </div>
      <div class="log-list" id="log-list"><div class="empty">Esperando registros…</div></div>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>
  <div class="overlay" id="overlay" hidden></div>

<script>
const MAX_LOGS = 500
const STATUS = {
  online:       { text: 'Activo',          dot: 'ok'   },
  connecting:   { text: 'Conectando…',     dot: 'warn' },
  reconnecting: { text: 'Reconectando…',   dot: 'warn' },
  stopped:      { text: 'Detenido',        dot: ''     },
}

let logs = []
let filter = 'all'
let lastState = null
let mapUrl = null
let mapFocus = null // posición a centrar al abrir el mapa
const cardEls = {}

// ── Utilidades ──────────────────────────────────────────────
const $ = (sel, root = document) => root.querySelector(sel)

function fmtTime(t) {
  return new Date(t).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
}
function ago(t) {
  const s = Math.max(0, Math.round((Date.now() - t) / 1000))
  if (s < 60) return `hace ${s} s`
  if (s < 3600) return `hace ${Math.floor(s / 60)} min`
  return `hace ${Math.floor(s / 3600)} h`
}
function fmtPos(p) { return p ? `(${p.x}, ${p.y}, ${p.z})` : '—' }
function prettyItem(name) { return name.replace(/_/g, ' ') }

let toastTimer
function toast(msg, isError = false) {
  const el = $('#toast')
  el.textContent = msg
  el.classList.toggle('error', isError)
  el.hidden = false
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => { el.hidden = true }, 3500)
}

async function post(url) {
  try {
    const res = await fetch(url, { method: 'POST', headers: { 'X-Panel': '1' } })
    const data = await res.json().catch(() => ({}))
    if (!res.ok || data.ok === false) toast(data.error || `Error ${res.status}`, true)
    else if (data.message) toast(data.message)
    return data
  } catch {
    toast('No se pudo contactar con el panel', true)
  }
}

// ── Tarjetas de bots ────────────────────────────────────────
function createCard(b) {
  const el = document.createElement('article')
  el.className = 'card'
  el.innerHTML = `
    <div class="card-head">
      <span class="emoji"></span>
      <div><div class="name"></div><div class="user"></div></div>
      <div class="status"><span class="dot"></span><span class="status-text"></span></div>

function updateCard(el, b) {
  const st = STATUS[b.status] || STATUS.stopped
  const online = b.status === 'online'
  const running = b.status !== 'stopped'

  $('.status .dot', el).className = 'dot ' + st.dot
  $('.status-text', el).textContent = st.text

  $('.act-text', el).textContent = b.activity ? b.activity.text : (running ? 'Sin actividad todavía' : 'Bot detenido')
  $('.ago', el).textContent = b.activity ? ' · ' + ago(b.activity.t) : ''

  const showIssue = !online && running && b.issue
  const issueEl = $('.issue', el)
  issueEl.hidden = !showIssue
  issueEl.textContent = showIssue ? b.issue : ''
  renderAlerts($('.alerts', el), b.alerts || [])
  const worst = (b.alerts || []).find(a => a.level !== 'info')
  // Siempre un booleano: con undefined, toggle() alterna la clase en cada redibujado (el borde parpadearía)
  el.classList.toggle('problem', !!showIssue || (!!worst && worst.level === 'err'))
  el.classList.toggle('caution', !!worst && worst.level === 'warn')

  $('.bar.health > span', el).style.width = online ? `${(b.health / 20) * 100}%` : '0'
  $('.hp', el).textContent = online ? `${b.health}/20` : '—'

  $('.pos', el).textContent = fmtPos(b.pos)
  const slots = $('.slots', el)
  slots.textContent = online ? `${b.freeSlots} huecos libres` : '—'
  slots.classList.toggle('low', online && b.freeSlots <= 3)
  $('.home', el).textContent = b.home
    ? fmtPos(b.home) + (b.homeChests ? ` · ${b.homeChests}/${b.maxChests} cofres` : '')
    : 'sin casa'
  renderItems($('.items', el), b.items)

  const dep = $('.deposit', el)
  if (!online) dep.textContent = ''
  else {
    const last = b.lastDeposit
      ? `último guardado ${ago(b.lastDeposit.t)} (${b.lastDeposit.stored} tipos)`
      : 'aún no ha guardado en esta sesión'
    dep.innerHTML = ''
    const strong = document.createElement('b')
    strong.textContent = b.pending > 0 ? `📦 ${b.pending} por guardar` : '📦 Nada por guardar'
    dep.append(strong, document.createTextNode(' · ' + last))
  }

  $('[data-act="start"]', el).disabled = running
  $('[data-act="stop"]', el).disabled = !running
  $('[data-act="restart"]', el).disabled = !running
  $('[data-act="home"]', el).disabled = !online
  const goHome = $('[data-act="gohome"]', el)
  goHome.disabled = !online || !b.home || b.goingHome || b.rescuing
  goHome.textContent = b.goingHome ? '🏡 Yendo a casa…' : '🏡 Volver a casa'
  const rescue = $('[data-act="escape"]', el)
  rescue.disabled = !online || b.rescuing || b.goingHome
  rescue.textContent = b.rescuing ? '🆘 Rescatando…' : '🆘 Rescatar'
  const organize = $('[data-act="organize"]', el)
  organize.disabled = !online || !b.home || b.organizing
  organize.textContent = b.organizing ? '🗂️ Organizando…' : '🗂️ Organizar ahora'
  el._pos = b.pos
  const mapBtn = $('.map-btn', el)
  mapBtn.hidden = !mapUrl
  mapBtn.disabled = !online || !b.pos
  $('[data-act="give"]', el).disabled = !online || !b.gifts || $('[data-act="give"]', el).classList.contains('busy')
}

const ALERT_ICON = { err: '🚨', warn: '⚠️', info: '💤' }
function renderAlerts(container, alerts) {
  container.replaceChildren(...alerts.map(a => {
    const row = document.createElement('div')
    row.className = 'alert ' + a.level
    const text = document.createElement('span')
    text.textContent = `${ALERT_ICON[a.level] || ''} ${a.text}`
    const since = document.createElement('span')
    since.className = 'since'
    since.textContent = ago(a.since)
    row.append(text, since)
    return row
  }))
}

// Fichas de inventario: las de reserva (lo que se queda a propósito) van atenuadas con 🔒
function renderItems(container, items) {
  container.replaceChildren(...items.map(i => {
    const chip = document.createElement('span')
    chip.className = 'chip' + (i.kept >= i.count ? ' kept' : '')
    let text = `${prettyItem(i.name)} ×${i.count}`
    if (i.kept >= i.count) text = `🔒 ${text}`
    else if (i.kept > 0) text += ` (🔒${i.kept})`
    chip.textContent = text
    chip.title = i.kept >= i.count ? 'Reserva: se lo queda al guardar'
      : i.kept > 0 ? `Se queda ${i.kept} de reserva y guarda ${i.count - i.kept}` : 'Lo guardará en casa'
    return chip
  }))
}

function renderState(state) {
  lastState = state
  // Desde otro equipo, "127.0.0.1" sería ese equipo: usar la misma dirección con la que se abrió el panel
  const map = state.map && state.map.replace(/\/\/(127\.0\.0\.1|localhost)(?=[:/]|$)/, `//${location.hostname}`)
  if (map !== mapUrl) {
    mapUrl = map
    $('[data-view="map"]').hidden = !mapUrl
  }
  const cards = $('#cards')
  for (const b of state.bots) {
    if (!cardEls[b.key]) {
      cardEls[b.key] = createCard(b)
      cards.appendChild(cardEls[b.key])
    }
    updateCard(cardEls[b.key], b)
  }

  // Resumen de alertas (las 'info' no cuentan), incluidas las del servidor
  const all = [...(state.serverAlerts || []), ...state.bots.flatMap(b => (b.alerts || []).filter(a => a.level !== 'info'))]
  $('#alert-summary').title = all.length ? all.map(a => a.text).join('\n') : 'Ir al primer bot con alertas'
  const sum = $('#alert-summary')
  const errs = all.filter(a => a.level === 'err').length
  sum.className = 'alert-summary' + (errs ? ' err' : all.length ? ' warn' : '')
  sum.textContent = all.length === 0 ? '✅ Sin alertas' : `${errs ? '🚨' : '⚠️'} ${all.length} ${all.length === 1 ? 'alerta' : 'alertas'}`

  const s = state.server
  $('#server-dot').className = 'dot ' + (s.online === null ? 'warn' : s.online ? 'ok' : 'err')
  $('#server-text').textContent = `Servidor ${s.host}:${s.port} · ` + (s.online === null ? 'comprobando…' : s.online ? 'en línea' : 'sin conexión')
  renderPerf(s.plugin)
  renderConsoleStatus(s.plugin)
  $('#meta').textContent = `Panel activo ${ago(state.startedAt).replace('hace ', '')} · ${state.memoryMB} MB`
}

function matches(entry) {
  if (filter === 'all') return true
  if (filter === 'panel') return !entry.bot
  return entry.bot === filter
}

function logEl(entry) {
  const div = document.createElement('div')
  div.className = 'log ' + (entry.level === 'log' ? '' : entry.level)
  const time = document.createElement('span')
  time.className = 'time'
  time.textContent = fmtTime(entry.t)
  div.append(time, document.createTextNode(entry.text))
  return div
}

function nearBottom(list) {
  return list.scrollHeight - list.scrollTop - list.clientHeight < 40
}

function renderLogs() {
  const list = $('#log-list')
  list.replaceChildren()
  const visible = logs.filter(matches)
  if (visible.length === 0) {
    list.innerHTML = '<div class="empty">No hay registros para este filtro.</div>'
    return
  }
  const frag = document.createDocumentFragment()
  visible.forEach(e => frag.appendChild(logEl(e)))
  list.appendChild(frag)
  list.scrollTop = list.scrollHeight
}

function appendLog(entry) {
  logs.push(entry)
  if (logs.length > MAX_LOGS) logs.shift()
  if (!matches(entry)) return
  const list = $('#log-list')
  const stick = nearBottom(list)
  $('.empty', list)?.remove()
  list.appendChild(logEl(entry))
  while (list.childElementCount > MAX_LOGS) list.firstElementChild.remove()
  if (stick) list.scrollTop = list.scrollHeight
}

const ITEM_NAMES = {
  diamond: 'Diamante', emerald: 'Esmeralda', gold: 'Oro', iron: 'Hierro', coal: 'Carbón', copper: 'Cobre',
  lapis: 'Lapislázuli', redstone: 'Redstone', nether_gold: 'Oro del Nether', nether_quartz: 'Cuarzo',
  cod: 'Bacalao', salmon: 'Salmón', pufferfish: 'Pez globo', tropical_fish: 'Pez tropical',
}
const itemLabel = n => ITEM_NAMES[n] || (n.charAt(0).toUpperCase() + n.slice(1)).replace(/_/g, ' ')

function fmtDuration(ms) {
  const min = Math.floor((ms || 0) / 60000)

// Barras horizontales de una sola serie, de mayor a menor
function renderHBars(container, obj) {
  const entries = Object.entries(obj || {}).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 8)
  if (entries.length === 0) {
    container.innerHTML = '<div class="chart-empty">Sin datos todavía</div>'
    return
  }
  const max = entries[0][1]
  container.replaceChildren(...entries.map(([name, v]) => {
    const row = document.createElement('div')
    row.className = 'hbar'
    row.title = `${itemLabel(name)}: ${fmtNum(v)}`
    row.innerHTML = '<span class="lbl"></span><div class="track"><div class="fill"></div></div><span class="val"></span>'
    row.querySelector('.lbl').textContent = itemLabel(name)
    row.querySelector('.fill').style.width = `${Math.max(2, (v / max) * 100)}%`
    row.querySelector('.val').textContent = fmtNum(v)
    return row
  }))
}

// Columnas por hora (últimas 24 h) con tooltip que desglosa por bot
function renderHourly(hourly, bots, now) {
  const wrap = $('#hourly-chart')
  const HOUR = 3600000
  const lastHour = Math.floor(now / HOUR) * HOUR
  const hours = Array.from({ length: 24 }, (_, i) => lastHour - (23 - i) * HOUR)
  const series = hours.map(h => {
    const per = hourly[h] || {}
    return { h, per, total: Object.values(per).reduce((a, v) => a + v, 0) }
  })
  const maxVal = Math.max(...series.map(s => s.total))
  if (maxVal === 0) {
    wrap.innerHTML = '<div class="chart-empty">Todavía no hay objetos guardados en las últimas 24 h</div>'
    return
  }

  // Escala "redonda" para el eje
  const pow = Math.pow(10, Math.floor(Math.log10(maxVal)))
  const top = [1, 2, 2.5, 5, 10].map(m => m * pow).find(v => v >= maxVal)
  const W = 720, H = 200, L = 40, R = 8, T = 10, B = 24
  const pw = W - L - R, ph = H - T - B
  const step = pw / 24
  const bw = Math.min(18, step * 0.62)
  const y = v => T + ph - (v / top) * ph
  const hourLabel = h => new Date(h).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' })

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Objetos guardados por hora en las últimas 24 horas">`
  for (const v of [0, top / 2, top]) {
    svg += `<line class="${v === 0 ? 'baseline' : 'gridline'}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`
    svg += `<text class="axis-label" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmtNum(v)}</text>`
  }
  series.forEach((s, i) => {
    const cx = L + step * i + step / 2
    if (i % 3 === 2 || i === 23) svg += `<text class="axis-label" x="${cx}" y="${H - 6}" text-anchor="middle">${hourLabel(s.h)}</text>`
    if (s.total > 0) {
      // Barra con extremo superior redondeado (4 px), anclada a la línea base
      const x0 = cx - bw / 2, y0 = y(s.total), yb = y(0), r = Math.min(4, bw / 2, yb - y0)
      svg += `<path class="bar" data-i="${i}" d="M${x0},${yb} V${y0 + r} Q${x0},${y0} ${x0 + r},${y0} H${x0 + bw - r} Q${x0 + bw},${y0} ${x0 + bw},${y0 + r} V${yb} Z"/>`
    }
    // Zona de interacción más grande que la barra (toda la columna)
    svg += `<rect class="hit" data-i="${i}" x="${L + step * i}" y="${T}" width="${step}" height="${ph}"/>`
  })
  svg += '</svg>'
  wrap.innerHTML = svg

  const tip = document.createElement('div')
  tip.className = 'chart-tip'
  tip.hidden = true
  wrap.appendChild(tip)
  const label = Object.fromEntries(bots.map(b => [b.key, `${b.emoji} ${b.label}`]))

  wrap.querySelectorAll('.hit').forEach(hit => {
    hit.addEventListener('mouseenter', () => {
      const i = Number(hit.dataset.i)
      const s = series[i]
      wrap.querySelectorAll('.bar').forEach(b => b.classList.toggle('hover', Number(b.dataset.i) === i))
      tip.innerHTML = ''
      const head = document.createElement('b')
      head.textContent = `${hourLabel(s.h)}–${hourLabel(s.h + HOUR)} · ${fmtNum(s.total)} objetos`
      tip.appendChild(head)
      for (const [k, v] of Object.entries(s.per).sort((a, b) => b[1] - a[1])) {
        const line = document.createElement('div')
        line.textContent = `${label[k] || k}: ${fmtNum(v)}`
        tip.appendChild(line)
      }
      // Arriba del área del gráfico (dentro del contenedor, para que no se recorte), sin salirse por los lados
      tip.hidden = false
      const svgEl = wrap.querySelector('svg')
      const scale = svgEl.getBoundingClientRect().width / W
      const half = tip.offsetWidth / 2
      const cx = (L + step * i + step / 2) * scale
      tip.style.left = `${Math.min(Math.max(cx, half + 2), svgEl.scrollWidth - half - 2)}px`
      tip.style.top = '2px'
    })
    hit.addEventListener('mouseleave', () => {
      tip.hidden = true
      wrap.querySelectorAll('.bar.hover').forEach(b => b.classList.remove('hover'))
    })
  })
}

function openMap(pos) {
  mapFocus = pos
  $('[data-view="map"]').click()
}

// ── Almacén: inventario y pedidos ───────────────────────────
let whData = null
let whCat = 'all'
const orderQty = {}
// Para buscar en español
const ES_ALIASES = {
  diamante: 'diamond', esmeralda: 'emerald', hierro: 'iron', oro: 'gold', cobre: 'copper', carbon: 'coal',
  lapislazuli: 'lapis', madera: 'log', tronco: 'log', tabla: 'planks', palo: 'stick', piedra: 'stone',
  roca: 'cobble', trigo: 'wheat', semilla: 'seeds', zanahoria: 'carrot', patata: 'potato', papa: 'potato',
  remolacha: 'beetroot', calabaza: 'pumpkin', sandia: 'melon', pescado: 'cod', bacalao: 'cod', salmon: 'salmon',
  carne: 'beef', cerdo: 'porkchop', pollo: 'chicken', cordero: 'mutton', conejo: 'rabbit', cocinado: 'cooked',
  lingote: 'ingot', cuero: 'leather', hueso: 'bone', cuerda: 'string', huevo: 'egg', pluma: 'feather',
  manzana: 'apple', pan: 'bread', arena: 'sand', grava: 'gravel', tierra: 'dirt', brote: 'sapling',
}
const plain = t => t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim()

async function loadWarehouse() {
  try {
    const res = await fetch('/api/warehouse', { cache: 'no-store' })
    whData = await res.json()
    renderWarehouse()
  } catch {}
}

function itemMatches(item, query) {
  if (!query) return true
  const name = item.name.replace(/_/g, ' ')
  const label = plain(itemLabel(item.name))
  return query.split(/\s+/).every(w => name.includes(w) || label.includes(w) || (ES_ALIASES[w] && name.includes(ES_ALIASES[w])))
}

function renderWarehouse() {
  const d = whData
  if (!d) return
  const org = d.organizer
  const total = d.items.reduce((a, i) => a + i.count, 0)
  $('#wh-meta').textContent = d.chests
    ? `${fmtNum(d.items.length)} tipos · ${fmtNum(total)} objetos en ${d.chests} cofres · ` +
      (d.live ? `🟢 en vivo, leído del servidor ${ago(d.lastScan)}` : `revisión completa ${d.lastScan ? ago(d.lastScan) : 'pendiente'}`)
    : ''

  // Jugadores (se conserva la elección)
  const sel = $('#wh-player')
  const chosen = sel.value
  const players = d.players
  if (sel.dataset.list !== players.join(',')) {
    sel.replaceChildren(...(players.length ? players : ['(nadie conectado)']).map(p => {
      const o = document.createElement('option')
      o.value = players.length ? p : ''
      o.textContent = p
      return o
    }))
    sel.dataset.list = players.join(',')
    if (players.includes(chosen)) sel.value = chosen
  }

  // Estado del Organizador
  const st = $('#wh-status')
  let text = 'Elige la cantidad y pulsa Pedir: el Organizador lo saca del almacén y te lo lleva con /tp.'
  let cls = ''
  if (!org.online) { text = '⚠️ El Organizador no está conectado: no se pueden hacer pedidos.'; cls = 'warn' }
  else if (!org.hasHome) { text = '⚠️ El Organizador no tiene almacén todavía.'; cls = 'warn' }
  else if (org.request) {
    const r = org.request
    text = `${r.started ? '🚚 Llevando' : '⏳ En cola:'} ${fmtNum(r.count)} × ${itemLabel(r.item)} para ${r.player}…`
    cls = 'busy'
  } else if (org.scanning) { text = '📋 Revisando todos los cofres del almacén…'; cls = 'busy' }
  else if (!players.length) { text = '⚠️ No hay ningún jugador conectado: entra al servidor para recibir pedidos.'; cls = 'warn' }
  else if (!d.chests) { text = 'Aún no hay inventario: pulsa "Revisar almacén" para que el Organizador lo cuente.' }
  else if (org.organizing) text = '🗂️ El Organizador está haciendo su ronda; un pedido la interrumpe y la retoma después.'
  st.textContent = text
  st.className = 'wh-status ' + cls
  const canOrder = org.online && org.hasHome && !org.request && players.length > 0
  // Con el plugin, actualizar es instantáneo y no depende del Organizador
  const scan = $('#wh-scan')
  scan.textContent = d.plugin ? '🔄 Actualizar' : '🔄 Revisar almacén'
  scan.title = d.plugin ? 'Leer ahora el contenido de los cofres directamente del servidor' : 'El Organizador abre todos los cofres del almacén y apunta lo que hay'
  scan.disabled = d.plugin ? false : (!org.online || !org.hasHome || org.scanning || !!org.request)

  // Categorías
  const cats = [...new Set(d.items.flatMap(i => i.cats))].sort()
  const chips = $('#wh-cats')
  if (chips.dataset.list !== cats.join(',')) {
    chips.replaceChildren(...['all', ...cats].map(c => {
      const b = document.createElement('button')
      b.className = 'tab' + (c === whCat ? ' active' : '')
      b.dataset.cat = c
      b.textContent = c === 'all' ? 'Todas' : c
      b.addEventListener('click', () => {
        whCat = c
        chips.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.cat === c))
        renderWarehouseTable(canOrder, true)
      })
      return b
    }))
    chips.dataset.list = cats.join(',')
  }
  renderWarehouseTable(canOrder)
}

function renderWarehouseTable(canOrder, force = false) {
  const table = $('#wh-table')
  // No redibujar mientras se escribe una cantidad (se perdería lo escrito)
  if (!force && table.contains(document.activeElement)) {
    table.querySelectorAll('.order button').forEach(b => { b.disabled = !canOrder })
    return
  }
  const query = plain($('#wh-search').value)
  const items = whData.items.filter(i => (whCat === 'all' || i.cats.includes(whCat)) && itemMatches(i, query))
  table.replaceChildren()
  const head = table.createTHead().insertRow()
  for (const h of ['Objeto', 'Categoría', 'Cantidad', 'Pedir']) {
    const th = document.createElement('th')
    th.textContent = h
    head.appendChild(th)
  }
  const body = table.createTBody()
  if (items.length === 0) {
    const cell = body.insertRow().insertCell()
    cell.colSpan = 4
    cell.className = 'chart-empty'
    cell.textContent = whData.items.length ? 'Nada coincide con la búsqueda' : 'Sin datos todavía'
    return
  }
  for (const item of items.slice(0, 300)) {
    const row = body.insertRow()
    const name = row.insertCell()
    name.className = 'item'
    name.textContent = itemLabel(item.name)
    name.title = item.name
    row.insertCell().textContent = item.cats.join(', ') || '—'
    const qtyCell = row.insertCell()
    qtyCell.textContent = fmtNum(item.count)
    if (item.count >= 128) {
      const st = document.createElement('span')
      st.className = 'stacks'
      st.textContent = `(${Math.floor(item.count / 64)} pilas)`
      qtyCell.appendChild(st)
    }
    const order = row.insertCell()
    order.className = 'order'
    const input = document.createElement('input')
    input.type = 'number'
    input.className = 'qty'
    input.min = 1
    input.max = Math.min(item.count, 27 * 64)
    input.value = orderQty[item.name] || Math.min(item.count, 64)
    input.setAttribute('aria-label', `Cantidad de ${itemLabel(item.name)}`)
    input.addEventListener('input', () => { orderQty[item.name] = input.value })
    const btn = document.createElement('button')
    btn.textContent = 'Pedir'
    btn.disabled = !canOrder
    btn.addEventListener('click', async () => {
      const count = Math.floor(Number(input.value))
      if (!(count >= 1)) return toast('Pon una cantidad válida', true)
      btn.classList.add('busy')
      try {
        await postJson('/api/warehouse/request', { item: item.name, count, player: $('#wh-player').value })
        await loadWarehouse()
      } finally { btn.classList.remove('busy') }
    })
    order.append(input, btn)
  }
}

async function postJson(url, body) {
  try {
    const res = await fetch(url, { method: 'POST', headers: { 'X-Panel': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    const data = await res.json().catch(() => ({}))
    if (!res.ok || data.ok === false) toast(data.error || `Error ${res.status}`, true)
    else if (data.message) toast(data.message)
    return data
  } catch {
    toast('No se pudo contactar con el panel', true)
  }
}

$('#wh-search').addEventListener('input', () => { if (whData) renderWarehouseTable(whData.organizer.online && whData.organizer.hasHome && !whData.organizer.request && whData.players.length > 0, true) })
$('#wh-scan').addEventListener('click', async () => {
  await post('/api/warehouse/scan')
  loadWarehouse()
})

// ── Servidor (plugin BotHelper) ─────────────────────────────
function renderPerf(p) {
  const el = $('#server-perf')
  el.hidden = !p || !p.online
  if (el.hidden) return
  const tps = p.tps[0]
  const usedGB = (p.memory.usedMB / 1024).toFixed(1), maxGB = (p.memory.maxMB / 1024).toFixed(1)
  el.innerHTML = ''
  const part = (text, bad, title) => {
    const span = document.createElement('span')
    span.textContent = text
    if (bad) span.className = 'bad'
    if (title) span.title = title
    return span
  }
  const humans = p.players.filter(x => !x.bot).length
  el.append(
    part(`${tps.toFixed(1)} TPS`, tps < 18, `TPS (lo normal es 20) · último minuto ${p.tps[0]}, 5 min ${p.tps[1]}, 15 min ${p.tps[2]}`), ' · ',
    part(`${Math.round(p.mspt)} ms/tick`, p.mspt > 45, 'Tiempo medio por tick (más de 50 ms = el servidor no da abasto)'), ' · ',
    part(`RAM ${usedGB}/${maxGB} GB`, false, 'Memoria usada por el servidor de Minecraft'), ' · ',
    part(`${fmtNum(p.entities)} entidades`, p.entities > 3000, `${fmtNum(p.chunks)} chunks cargados`), ' · ',
    part(`👤 ${humans}`, false, `Jugadores: ${p.players.filter(x => !x.bot).map(x => x.name).join(', ') || 'ninguno'} (+${p.players.length - humans} bots)`),
  )
}

// ── Consola ─────────────────────────────────────────────────
const consoleHistory = []
let historyPos = 0

function renderConsoleStatus(p) {
  const st = $('#console-status')
  const online = !!(p && p.online)
  st.textContent = online
    ? 'Los comandos se ejecutan como la consola del servidor (con todos los permisos). Quedan apuntados en el registro del panel.'
    : '⚠️ El plugin BotHelper no está conectado: la consola no está disponible.'
  st.className = 'wh-status' + (online ? '' : ' warn')
  $('#console-form button').disabled = !online
}

function consoleLine(text, cls) {
  const out = $('#console-out')
  const span = document.createElement('span')
  if (cls) span.className = cls
  span.textContent = text + '\n'
  out.appendChild(span)
  out.scrollTop = out.scrollHeight
}

$('#console-form').addEventListener('submit', async (ev) => {
  ev.preventDefault()
  const input = $('#console-input')
  const command = input.value.trim()
  if (!command) return
  consoleHistory.push(command)
  historyPos = consoleHistory.length
  input.value = ''
  consoleLine(`> /${command.replace(/^\//, '')}`, 'cmd')
  const btn = $('#console-form button')
  btn.classList.add('busy')
  try {
    const res = await fetch('/api/console', { method: 'POST', headers: { 'X-Panel': '1', 'Content-Type': 'application/json' }, body: JSON.stringify({ command }) })
    const data = await res.json().catch(() => ({}))
    if (!res.ok || data.ok === false) consoleLine(data.error || `Error ${res.status}`, 'err')
    else if (data.syntaxError) consoleLine(`Error en el comando: ${data.syntaxError}`, 'err')
    else if (data.output.length) data.output.forEach(l => consoleLine(l))
    else consoleLine(data.known ? '(sin respuesta)' : 'Comando desconocido', data.known ? 'muted' : 'err')
  } catch {
    consoleLine('No se pudo contactar con el panel', 'err')
  } finally {
    btn.classList.remove('busy')
  }
})

$('#console-input').addEventListener('keydown', (ev) => {
  if (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown') return
  ev.preventDefault()
  historyPos = Math.max(0, Math.min(consoleHistory.length, historyPos + (ev.key === 'ArrowUp' ? -1 : 1)))
  ev.target.value = consoleHistory[historyPos] || ''
})

// ── Conexión en vivo ────────────────────────────────────────
let shutDown = false
function connect() {
  const es = new EventSource('/api/events')
  es.addEventListener('init', (ev) => {
    const data = JSON.parse(ev.data)
    logs = data.logs
    renderLogs()
    renderState(data.state)
    $('#overlay').hidden = true
  })
  es.addEventListener('state', (ev) => renderState(JSON.parse(ev.data)))
  es.addEventListener('log', (ev) => appendLog(JSON.parse(ev.data)))
  es.addEventListener('shutdown', () => {
    shutDown = true
    es.close()
    showOverlay('Panel apagado', 'Los bots se han detenido. Ya puedes cerrar esta ventana.')
  })
  es.onerror = () => {
    if (shutDown) return
    showOverlay('Sin conexión con el panel', 'Reintentando… Si cerraste el panel, ábrelo con abrir_panel.bat')
  }
}
connect()

// Refresca los "hace X s" aunque no llegue estado nuevo
setInterval(() => { if (lastState) renderState(lastState) }, 1000)
</script>
